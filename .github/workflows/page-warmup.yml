name: Page warmup

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: URL to warm up
        required: true
        type: string
      readiness_header:
        description: Response header that reports readiness (optional)
        required: false
        type: string
      not_ready_value:
        description: Header value that means "not ready"
        required: false
        type: string
        default: asleep
      headed:
        description: Run Chrome with a virtual display for a manual test
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  warmup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: ${{ inputs.target_url }}
      HEADLESS: ${{ inputs.headed && 'false' || 'true' }}
      READINESS_HEADER: ${{ inputs.readiness_header }}
      NOT_READY_VALUE: ${{ inputs.not_ready_value || 'asleep' }}
      RUST_LOG: ${{ inputs.headed && 'headless_chrome::browser::process=trace' || '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: page-warmup:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Visit app in container
        timeout-minutes: 5
        run: |
          docker compose run --rm page-warmup
